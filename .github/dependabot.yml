version: 2

# One weekly pull request per ecosystem for minor and patch updates, so they stay reviewable.
# Major updates come as separate pull requests. The prefix keeps the titles valid for the
# Conventional Commits check.
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Dockerfile base images, pinned by tag and digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # MCR already serves the .NET 11 release candidate. Move to a new .NET major by hand.
    # Dependabot names MCR images without the registry ("dotnet/sdk"), hence both patterns.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The workflow actions, pinned by commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
