name: Release

# The fork's only workflow. Pushing a tag such as v0.10.0-fork.1 builds and scans the image,
# pushes and signs it on GHCR, and creates the GitHub release with the compose files.
# Builds and tests run locally before tagging.
on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: albrtbc/guardou
  TAG: ${{ github.ref_name }}

jobs:
  # The scan runs with a read-only token and no registry credentials for pushing, apart from
  # reading the build cache. The publish job, which can push and sign, starts only if the
  # image passes, so a vulnerable image never gets a tag.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Require the tag on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag ${TAG} does not point to a commit on main."
            exit 1
          fi

      - name: Require the tag to match the project version
        # Fork releases are tagged vX.Y.Z-fork.N on top of upstream's X.Y.Z.
        run: |
          tag="${TAG#v}"
          tag="${tag%%-fork.*}"
          server=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' server/Directory.Build.props)
          frontend=$(sed -n 's/^version: *\([^ #]*\).*/\1/p' frontend/pubspec.yaml)
          if [ "$tag" != "$server" ] || [ "$tag" != "$frontend" ]; then
            echo "::error::Tag ${tag}, server ${server} and frontend ${frontend} must be equal."
            exit 1
          fi

      # The publish job builds exactly this commit, even if the tag moves in between.
      - name: Record the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The scan covers the amd64 build; the arm64 image has the same packages. This job writes
      # no cache: the Actions cache needs no permission to write, so the publish job must not
      # read anything this job could have changed. It reads only the registry cache, which
      # only the publish job can write.
      - name: Build the image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: guardou:scan
          # A new value on every run rebuilds the apk upgrade layer with current packages.
          build-args: APK_UPGRADE_KEY=${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: guardou:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true

  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.scan.outputs.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APK_UPGRADE_KEY=${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

  # Not a prerelease: the docs link to releases/latest for the compose files.
  github-release:
    needs: [scan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.scan.outputs.sha }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          version="${TAG#v}"
          notes=$(printf '%s\n\n%s\n\n%s\n' \
            "Image: \`${REGISTRY}/${IMAGE_NAME}:${version}@${DIGEST}\`" \
            "Signed with cosign (keyless, this workflow). Read docs/docs/administration/upgrading.mdx before upgrading." \
            "Attached: the hardened docker-compose.yaml and example.env.")
          gh release create "$TAG" docker/docker-compose.yaml docker/example.env \
            --verify-tag --title "$TAG" --notes "$notes" --generate-notes
